
name: Build Faris Accounting APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'project.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e
          test -f project.zip || {
            echo "ERROR: project.zip is missing from repository root."
            exit 1
          }

          mkdir -p source
          unzip -q project.zip -d source

          PACKAGE_FILE="$(find source -type f -name package.json -print -quit)"
          test -n "$PACKAGE_FILE" || {
            echo "ERROR: package.json was not found in ZIP."
            exit 1
          }

          PROJECT_DIR="$(dirname "$PACKAGE_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory: $PROJECT_DIR"

      - name: Prepare npm
        run: |
          npm install --global npm@10.9.2
          npm cache clean --force

      - name: Install project dependencies
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps --no-audit --no-fund \
              || npm install --legacy-peer-deps --no-audit --no-fund
          else
            npm install --legacy-peer-deps --no-audit --no-fund
          fi

      - name: Build web project
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          npm run build

      - name: Verify web files
        shell: bash
        run: |
          set -e
          if [ ! -d "$PROJECT_DIR/public/faris" ]; then
            echo "ERROR: public/faris folder not found."
            echo "Check the webDir configured for this project."
            exit 1
          fi

          test -f "$PROJECT_DIR/public/faris/index.html"

      - name: Install Capacitor tools
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          npm install @capacitor/core @capacitor/android \
            --legacy-peer-deps --no-audit --no-fund

          npm install --save-dev @capacitor/cli \
            --legacy-peer-deps --no-audit --no-fund

      - name: Configure Capacitor
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const config = {
            appId: 'com.storesync.billing',
            appName: 'محاسب فارس الزعزعي',
            webDir: 'public/faris'
          };

          fs.writeFileSync(
            'capacitor.config.json',
            JSON.stringify(config, null, 2)
          );
          NODE

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Configure Android file permissions
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          fi

          if ! grep -q 'android.permission.READ_EXTERNAL_STORAGE' "$MANIFEST"; then
            sed -i '/<application/i\
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />' "$MANIFEST"
          fi

          echo "Android legacy storage permissions configured."
          echo "Use Android system file picker for modern Android versions."

      - name: Build Android APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Faris-Accounting-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
