name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'project.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e
          test -f project.zip || {
            echo "ERROR: project.zip not found in repository root."
            exit 1
          }

          mkdir -p source
          unzip -oq project.zip -d source

          PACKAGE_FILE="$(find source -type f -name package.json -not -path '*/node_modules/*' -print -quit)"

          if [ -z "$PACKAGE_FILE" ]; then
            echo "ERROR: package.json not found inside project.zip."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PACKAGE_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Prepare npm
        run: |
          npm install --global npm@10.9.2
          npm cache clean --force

      - name: Install project dependencies
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps --no-audit --no-fund \
              || npm install --legacy-peer-deps --no-audit --no-fund
          else
            npm install --legacy-peer-deps --no-audit --no-fund
          fi

      - name: Build web project
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
            npm run build
          else
            echo "No build script found; using existing web files."
          fi

      - name: Prepare web files
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f capacitor.config.json ]; then
            WEB_DIR="$(node -e "console.log(require('./capacitor.config.json').webDir || 'www')")"
          else
            WEB_DIR="public/faris"
          fi

          if [ ! -f "$WEB_DIR/index.html" ]; then
            if [ -f "public/faris/index.html" ]; then
              WEB_DIR="public/faris"
            elif [ -f "dist/index.html" ]; then
              WEB_DIR="dist"
            elif [ -f "www/index.html" ]; then
              WEB_DIR="www"
            else
              echo "ERROR: index.html was not found in public/faris, dist, or www."
              exit 1
            fi
          fi

          echo "WEB_DIR=$WEB_DIR" >> "$GITHUB_ENV"
          echo "Web directory: $WEB_DIR"

      - name: Install Capacitor tools
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          npm install @capacitor/core @capacitor/android \
            --legacy-peer-deps --no-audit --no-fund

          npm install --save-dev @capacitor/cli \
            --legacy-peer-deps --no-audit --no-fund

      - name: Configure Capacitor
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const webDir = process.env.WEB_DIR;

          const config = {
            appId: 'com.storesync.billing',
            appName: 'محاسب فارس الزعزعي',
            webDir
          };

          fs.writeFileSync(
            'capacitor.config.json',
            JSON.stringify(config, null, 2)
          );
          NODE

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Build Android APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR/android"

          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Faris-Accounting-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
